<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>WAAP | Admin Panel - Add User</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        body { background-color: #0f172a; color: white; height: 100vh; display: flex; align-items: center; justify-content: center; }
        .card { background-color: #1e293b; border: none; border-radius: 15px; width: 400px; }
        .form-control, .form-select { background-color: #334155; border: none; color: white; }
        .form-control:focus { background-color: #334155; color: white; box-shadow: 0 0 10px #3b82f6; }
    </style>
</head>
<body>
    <div class="card p-4 shadow-lg">
        <h3 class="text-center mb-4">➕ Add New User</h3>
        <form method="POST">
            <div class="mb-3">
                <label class="form-label">Username</label>
                <input type="text" name="new_user" class="form-control" placeholder="Enter username" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Password</label>
                <input type="password" name="new_pass" class="form-control" placeholder="Enter password" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Role</label>
                <select name="role" class="form-select">
                    <option value="Regular User">Regular User</option>
                    <option value="Administrator">Administrator</option>
                </select>
            </div>
            <button type="submit" class="btn btn-primary w-100 py-2">Create User</button>
        </form>
        <hr>
        <a href="/dashboard" class="text-center text-info text-decoration-none">← Back to Dashboard</a>
        {% if msg %}
            <div class="alert mt-3 {% if 'Error' in msg %}alert-danger{% else %}alert-success{% endif %}" style="font-size: 0.9rem;">
                {{ msg }}
            </div>
        {% endif %}
    </div>
</body>
</html>
